# Compila y prueba ZUENA Plugins en Windows en cada cambio. Los VST3 quedan como artefactos:
# es la base para firmar binarios con un servicio de firma para código abierto (SignPath Foundation).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Entorno de Visual Studio (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar (CMake + Ninja, Release)
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build/release --parallel

      - name: Pruebas del motor
        shell: pwsh
        run: |
          & build/release/plugins/ZuenaEQ/run_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/release/plugins/ZuenaLuma/luma_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # ZUENA Link: núcleo (anillo, puente de relojes, WAV, rutas, protocolo) y capa Windows
          # (memoria compartida entre procesos, motor → receptor de OBS, grabación, WASAPI, tiempo real).
          & build/release/plugins/ZuenaLink/link_core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/release/plugins/ZuenaLink/link_platform_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Auditoría de interfaz y VST3
        shell: pwsh
        run: |
          & build/release/plugins/ZuenaEQ/zeq_snapshot_artefacts/Release/zeq_snapshot.exe audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/release/plugins/ZuenaLuma/luma_qa_artefacts/Release/luma_qa.exe editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/release/plugins/ZuenaLuma/luma_qa_artefacts/Release/luma_qa.exe host "build/release/plugins/ZuenaLuma/ZuenaLuma_artefacts/Release/VST3/ZUENA Luma.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/release/plugins/ZuenaLink/link_qa_artefacts/Release/link_qa.exe editor build/link-capturas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/release/plugins/ZuenaLink/link_qa_artefacts/Release/link_qa.exe host "build/release/plugins/ZuenaLink/ZuenaLink_artefacts/Release/VST3/ZUENA Link.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node plugins/ZuenaLink/tools/check-ui-text.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # La fuente de OBS real (zuena-link.dll) cargada contra un obs.dll de prueba, como la carga OBS.
          & build/release/plugins/ZuenaLink/obs-sim/link_obs_sim.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Free-VST-Client/package-lock.json

      - name: Pruebas del launcher
        working-directory: Free-VST-Client
        run: |
          npm ci
          # Los paquetes de plugins no están en el repositorio: se arman con los VST3 recién compilados
          # (también verifica que la versión de cada DLL coincida con CMake).
          node build/pack-eq.js --all
          npm test

      - name: Artefactos (VST3)
        uses: actions/upload-artifact@v4
        with:
          name: zuena-plugins-vst3
          path: |
            build/release/plugins/ZuenaEQ/ZuenaEQ_artefacts/Release/VST3/
            build/release/plugins/ZuenaLuma/ZuenaLuma_artefacts/Release/VST3/
            build/release/plugins/ZuenaLink/ZuenaLink_artefacts/Release/VST3/
            build/release/plugins/ZuenaLink/zuena-link.dll
            build/link-capturas/
          if-no-files-found: error
